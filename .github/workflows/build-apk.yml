name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
defaults:
  run:
    working-directory: "echo-english-app (1)/echo-app"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Add permissions
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.CAMERA"/><uses-feature android:name="android.hardware.camera" android:required="false"/><queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build APK
        working-directory: "echo-english-app (1)/echo-app/android"
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Echo-English-APK
          path: "echo-english-app (1)/echo-app/android/app/build/outputs/apk/debug/app-debug.apk"
