<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echo 英语陪练</title>
<script src="capacitor.js"></script>
<script src="tess/tesseract.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mut:#6b7385;--pri:#4f6df5;--ok:#22a06b;--bad:#e5484d;--bub:#e9edff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1c202b;--tx:#eef0f6;--mut:#99a1b5;--pri:#7b93ff;--ok:#3ccf91;--bad:#ff7a7f;--bub:#262c45}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1c202b;--tx:#eef0f6;--mut:#99a1b5;--pri:#7b93ff;--ok:#3ccf91;--bad:#ff7a7f;--bub:#262c45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:560px;margin:auto;min-height:100vh}
header{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}.stars{color:#f5a524;font-weight:600}
nav{display:flex;gap:8px;padding:8px 16px}nav button{flex:1;padding:10px 4px;border:0;border-radius:12px;background:var(--card);color:var(--tx);font-size:14px}
nav button.on{background:var(--pri);color:#fff}
main{padding:8px 16px 120px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--card);border-radius:16px;padding:14px;text-align:center;border:0;color:var(--tx);font-size:14px;width:100%}
.card .e{font-size:40px}.card b{display:block;font-size:17px}.card small{color:var(--mut)}
.list .card{text-align:left;margin-bottom:10px;display:block}
.chat{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.b{max-width:85%;padding:10px 12px;border-radius:14px;line-height:1.45}
.ai{background:var(--bub);align-self:flex-start}.me{background:var(--pri);color:#fff;align-self:flex-end}
.b small{display:block;opacity:.7;margin-top:4px}
.fb{font-size:13px;align-self:center;color:var(--mut)}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);max-width:560px;margin:auto;display:flex;gap:8px;align-items:center}
.mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:28px;flex:none}
.mic.rec{background:var(--bad);animation:p 1s infinite}@keyframes p{50%{transform:scale(1.1)}}
.bar input{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--tx)}
.sm{padding:10px;border:0;border-radius:10px;background:var(--bub);color:var(--tx)}
.back{border:0;background:none;color:var(--pri);font-size:15px;padding:0}
.note{color:var(--mut);font-size:12px;margin-top:14px}
</style></head><body>
<header><h1>🎧 Echo 英语陪练</h1><div class="stars" id="stars">⭐ 0</div></header>
<nav id="nav"></nav><main id="main"></main><div id="barwrap"></div>
<script>
const $=s=>document.querySelector(s);
const WORDS=[["🐶","dog","小狗"],["🐱","cat","小猫"],["🍎","apple","苹果"],["🍌","banana","香蕉"],["💧","water","水"],["🥛","milk","牛奶"],["🚗","car","汽车"],["☀️","sun","太阳"],["🌙","moon","月亮"],["👋","hello","你好"],["🐘","elephant","大象"],["📖","book","书"]];
const SCN={daily:[
{t:"打招呼",e:"👋",s:[{a:"Hi! How are you today?",z:"你好!你今天怎么样?",x:["I’m fine, thank you","I’m good, thanks"]},{a:"Nice! What’s your name?",z:"真好!你叫什么名字?",x:["My name is Tom","I’m Tom"]},{a:"Nice to meet you, Tom!",z:"很高兴认识你!",x:["Nice to meet you too"]}]},
{t:"咖啡店点单",e:"☕",s:[{a:"Welcome! What would you like to drink?",z:"欢迎!想喝点什么?",x:["I’d like a coffee, please","Can I have a latte, please"]},{a:"Sure. Hot or iced?",z:"好的,热的还是冰的?",x:["Iced, please","Hot, please"]},{a:"That’s five dollars.",z:"一共五美元。",x:["Here you are","Here is the money"]}]}],
biz:[
{t:"会议自我介绍",e:"💼",s:[{a:"Welcome to the meeting. Could you introduce yourself?",z:"欢迎参会,请做个自我介绍?",x:["Sure, I’m Li from the marketing team","Hello, I’m the project manager"]},{a:"Great. What are you working on now?",z:"你现在在做什么项目?",x:["I’m working on the new product launch","I’m leading the sales report"]},{a:"Sounds interesting. Any challenges?",z:"听起来不错,有什么挑战吗?",x:["The main challenge is the deadline","We need more budget"]}]},
{t:"约会议时间",e:"📅",s:[{a:"Hi, can we schedule a meeting this week?",z:"我们这周约个会?",x:["Sure, how about Wednesday afternoon","Yes, I’m free on Thursday"]},{a:"Wednesday works. What time?",z:"周三可以,几点?",x:["Let’s say three o’clock","How about two thirty"]},{a:"Perfect. I will send the invitation.",z:"好,我发邀请。",x:["Thank you, see you then","Great, talk to you soon"]}]}]};
let stars=0;try{stars=+localStorage.getItem("st")||0}catch(e){}
const addStar=n=>{stars+=n;$("#stars").textContent="⭐ "+stars;try{localStorage.setItem("st",stars)}catch(e){}};
const synth=window.speechSynthesis,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NP=(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())?Capacitor.Plugins:null;
const speak=async(t,r=.9)=>{t=t.replace(/’/g,"'");if(NP&&NP.TextToSpeech){try{await NP.TextToSpeech.stop()}catch(e){}try{await NP.TextToSpeech.speak({text:t,lang:"en-US",rate:r,pitch:1,volume:1})}catch(e){}return}
 return new Promise(ok=>{if(!synth)return ok();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r;u.onend=u.onerror=ok;synth.cancel();synth.speak(u)})};
async function listen(){if(NP&&NP.SpeechRecognition){try{const S=NP.SpeechRecognition;const a=await S.available();if(!a.available)return null;const p=await S.requestPermissions();if(p.speechRecognition!=="granted")return null;const res=await S.start({language:"en-US",maxResults:1,partialResults:false,popup:false});return (res.matches&&res.matches[0])||""}catch(e){return ""}}
 return new Promise(ok=>{if(!SR)return ok(null);const r=new SR();r.lang="en-US";r.interimResults=false;let d=0;const f=v=>{if(!d){d=1;ok(v)}};r.onresult=e=>f(e.results[0][0].transcript);r.onerror=()=>f("");r.onend=()=>f("");try{r.start()}catch(e){f("")}})}
const norm=s=>s.toLowerCase().replace(/’/g,"'").replace(/[^a-z' ]/g," ").split(/\s+/).filter(Boolean);
const score=(said,exp)=>{const w=norm(said);return Math.max(...exp.map(x=>{const e=norm(x);return e.filter(k=>w.includes(k)).length/e.length}))};
let tab="kids";
function nav(){$("#nav").innerHTML=[["kids","👶 启蒙"],["daily","☕ 日常"],["biz","💼 商务"],["chat","🤖 自由"],["scan","📷 扫读"]].map(([k,n])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';nav();home()">${n}</button>`).join("")}
let ocr=null,stxt="",slow=false;
async function scanImg(f){if(!f)return;const st=$("#sst");st.textContent="加载图片…";const im=$("#sim");im.src=URL.createObjectURL(f);im.style.display="block";
 await new Promise(r=>im.onload=r);const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");c.width=im.naturalWidth*k;c.height=im.naturalHeight*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
 try{if(!ocr){st.textContent="首次加载识别引擎…";const b=new URL("tess/",location.href).href;ocr=await Tesseract.createWorker("eng",1,{workerPath:b+"worker.min.js",corePath:b,langPath:b,gzip:true,cacheMethod:"none"})}
  st.textContent="识别中…";const r=await ocr.recognize(c);stxt=r.data.text.replace(/\|/g,"I").replace(/[ \t]+/g," ").trim();
  if(!stxt){st.textContent="没识别到英文,请靠近一点、保持光线充足再拍";return}st.textContent="点单词听发音,点按钮朗读全文";showScan()}
 catch(e){st.textContent="识别失败:"+e.message}}
function showScan(){const w=stxt.split("\n").map(l=>l.split(" ").map(x=>x?`<span onclick="speak('${x.replace(/[^A-Za-z]/g,"")}',.7)" style="padding:2px;display:inline-block">${x}</span>`:"").join(" ")).join("<br>");
 $("#sres").innerHTML=`<div class="card" style="text-align:left;margin-top:10px;line-height:1.9">${w}</div><div style="display:flex;gap:8px;margin-top:10px"><button class="sm" style="flex:1" onclick="readAll()">🔊 读全文</button><button class="sm" id="sl" onclick="slow=!slow;this.textContent=slow?'🐢 慢速':'🐇 正常'">🐇 正常</button><button class="sm" onclick="synth&&synth.cancel();NP&&NP.TextToSpeech&&NP.TextToSpeech.stop()">⏹</button></div>`}
async function readAll(){for(const x of stxt.replace(/\n+/g," ").split(/(?<=[.!?])\s+/)){if(x.trim())await speak(x,slow?.6:.9)}}
let fc=null;
const SYS={kids:"You are a friendly English teacher for a young child. Use very simple words and ONE short sentence. Be encouraging.",daily:"You are a friendly English conversation partner for a beginner (A2). Reply in 1-2 short sentences and end with a simple question.",biz:"You are a professional business English coach playing a colleague. Reply in 1-2 sentences, professional tone, and end with a question."};
const LN={kids:"👶 宝宝/零基础",daily:"☕ 日常英语",biz:"💼 商务英语"};
const gu=()=>{try{return localStorage.getItem("llm")||"http://127.0.0.1:8080/v1/chat/completions"}catch(e){return "http://127.0.0.1:8080/v1/chat/completions"}};
function freeStart(l){fc={l,h:[]};$("#main").innerHTML=`<button class="back" onclick="home()">← 返回</button><div class="chat" id="chat"></div>`;
 $("#barwrap").innerHTML=`<div class="bar"><input id="ti" placeholder="输入或点麦克风说英文" onkeydown="if(event.key=='Enter')typed()"><button class="mic" id="mic" onclick="talk()">🎤</button></div>`;
 const g={kids:"Hello! What is your name?",daily:"Hi! How was your day?",biz:"Good morning. What do you do at work?"}[l];add("b ai",g);fc.h.push({role:"assistant",content:g});speak(g)}
async function freeHandle(t){add("b me",t);fc.h.push({role:"user",content:t});const d=add("b ai","…");busy=1;
 try{const sys=SYS[fc.l]+" After your reply, on a new line write '纠正:' followed by a very short Chinese correction of the learner's last sentence, or '纠正: 很好' if it has no mistakes. Write nothing else.";
  const r=await fetch(gu(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{role:"system",content:sys},...fc.h.slice(-8)],max_tokens:140,temperature:.7})});
  const j=await r.json();const raw=j.choices[0].message.content.trim();const parts=raw.split(/纠正[:：]/);const rep=parts[0].trim()||raw,tip=(parts[1]||"").trim();
  fc.h.push({role:"assistant",content:rep});d.innerHTML=rep+(tip?`<small>📝 ${tip}</small>`:"");addStar(1);busy=0;await speak(rep)}
 catch(e){busy=0;d.innerHTML="连接不到本地模型。请先在 Termux 启动 llama-server(见 README)。";d.className="fb bad"}}
function home(){fc=null;$("#barwrap").innerHTML="";synth&&synth.cancel();
 if(tab=="scan"){$("#main").innerHTML=`<p>拍下英文(书本、路牌、菜单),自动识别并朗读。</p><label class="card" style="display:block"><div class="e" style="font-size:40px">📷</div><b>拍照 / 选择图片</b><input id="pic" type="file" accept="image/*" capture="environment" hidden onchange="scanImg(this.files[0])"></label><div class="note" id="sst"></div><img id="sim" style="max-width:100%;border-radius:12px;margin-top:10px;display:none"><div id="sres"></div>`;return}
 if(tab=="chat"){$("#main").innerHTML=`<p>和本地 AI 自由聊天(离线)。选择水平:</p><div class="list">${Object.keys(LN).map(k=>`<button class="card" onclick="freeStart('${k}')"><b>${LN[k]}</b></button>`).join("")}</div><div class="note">模型地址:<input id="u" style="width:100%" value="${gu()}" onchange="try{localStorage.setItem('llm',this.value)}catch(e){}"></div>`;return}
 if(tab=="kids"){$("#main").innerHTML=`<p>点卡片听发音,再点 🎤 跟读,读对得星星!</p><div class="grid">${WORDS.map((w,i)=>`<button class="card" onclick="kid(${i})"><div class="e">${w[0]}</div><b>${w[1]}</b><small>${w[2]}</small></button>`).join("")}</div><div class="note" id="kn"></div>`;return}
 $("#main").innerHTML=`<div class="list">${SCN[tab].map((s,i)=>`<button class="card" onclick="start(${i})"><b>${s.e} ${s.t}</b><small>${s.s.length} 轮对话 · 语音互动</small></button>`).join("")}</div><div class="note">提示:请使用 Chrome / Safari 并允许麦克风。不支持语音识别时可用文字输入。</div>`}
async function kid(i){const w=WORDS[i];$("#kn").textContent="听:"+w[1];await speak(w[1],.7);$("#kn").textContent="轮到你啦,大声说:"+w[1];const r=await listen();
 if(r===null){$("#kn").textContent="当前浏览器不支持语音识别,先听发音练习吧";return}
 if(score(r,[w[1]])>=1){addStar(1);$("#kn").textContent="🎉 太棒了!+1 ⭐";speak("Great job!")}else{$("#kn").textContent=`听到的是“${r||"…"}”,再试一次吧`;}}
let sc,step,busy;
function start(i){fc=null;sc=SCN[tab][i];step=0;$("#main").innerHTML=`<button class="back" onclick="home()">← 返回</button><div class="chat" id="chat"></div>`;
 $("#barwrap").innerHTML=`<div class="bar"><button class="sm" onclick="hint()">💡</button><input id="ti" placeholder="或输入英文回答" onkeydown="if(event.key=='Enter')typed()"><button class="mic" id="mic" onclick="talk()">🎤</button></div>`;aiSay()}
const add=(c,h)=>{const d=document.createElement("div");d.className=c;d.innerHTML=h;$("#chat").appendChild(d);d.scrollIntoView({block:"end"});return d};
async function aiSay(){const s=sc.s[step];add("b ai",`${s.a}<small>${s.z}</small>`);busy=1;await speak(s.a);busy=0}
function hint(){if(fc)return;add("fb",`💡 参考回答:${sc.s[step].x[0]}`);speak(sc.s[step].x[0],.8)}
async function talk(){if(busy)return;const m=$("#mic");m.classList.add("rec");busy=1;const r=await listen();m.classList.remove("rec");busy=0;
 if(r===null){add("fb bad","此浏览器不支持语音识别,请用文字输入");return}
 if(!r){add("fb bad","没听清,再说一次吧");return}handle(r)}
function typed(){const v=$("#ti").value.trim();if(v&&!busy){$("#ti").value="";handle(v)}}
async function handle(t){if(fc)return freeHandle(t);add("b me",t);const s=sc.s[step],p=score(t,s.x);
 if(p>=.6){add("fb ok","✅ 很棒!+1 ⭐");addStar(1)}else{add("fb bad",`🔸 可以更好,试试:${s.x[0]}`);await speak(s.x[0],.8)}
 step++;if(step<sc.s.length){await aiSay()}else{add("fb ok","🎉 本场对话完成!");addStar(3);speak("Well done! See you next time.")}}
nav();home();$("#stars").textContent="⭐ "+stars;
</script></body></html>
